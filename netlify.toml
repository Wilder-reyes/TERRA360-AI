# TERRA360 AI — deploy the React frontend from a GitHub monorepo on Netlify.
# The backend is deployed separately at Render (https://terra360-api.onrender.com).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Public same-origin reverse proxy: the React app requests /api/... .
# Netlify forwards to Render server-side. Do NOT put Earthdata credentials here.
# This rule must be BEFORE the single-page-app fallback.
[[redirects]]
  from = "/api/*"
  to = "https://terra360-api.onrender.com/api/:splat"
  status = 200
  force = true

# Preserve deep links for React without turning API endpoints into index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Do not configure VITE_API_URL in Netlify: in production the app uses
# relative /api paths, and the rewrite above forwards them to Render.
# If VITE_API_URL is already configured, remove it and redeploy.
# EARTHDATA_TOKEN belongs exclusively in the Render backend secret environment.
