name: TERRA360 farmer interface browser checks
on:
  pull_request:
    paths:
      - 'frontend/e2e/**'
      - 'frontend/src/GeoWorkspace.tsx'
      - 'frontend/src/ParcelNDVI.tsx'
      - 'frontend/src/SentinelSeries.tsx'
      - 'frontend/src/GpmPolygon.tsx'
      - 'frontend/src/SmapRegional.tsx'
      - 'frontend/src/smap-regional.css'
      - 'frontend/src/gpm-polygon.css'
      - 'frontend/src/sentinel-series.css'
      - 'frontend/src/parcel-ndvi.css'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright runner locally to CI
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.58.0
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts --reporter=line
