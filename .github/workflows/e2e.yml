name: NSPACE BIOTEX farmer interface browser checks
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/e2e.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts --reporter=line
