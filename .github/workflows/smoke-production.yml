name: TERRA360 public demo smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-production.yml'
      - 'scripts/smoke_public_demo.py'
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Netlify, Render, crop search, ARIE and NASA POWER
        run: python scripts/smoke_public_demo.py
