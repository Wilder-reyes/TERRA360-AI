name: BIOTEX Vercel and Render production contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-production.yml'
      - 'scripts/smoke_chalhuas_public.py'
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Vercel frontend and Render Chalhuas API
        run: python scripts/smoke_chalhuas_public.py
