name: Private NASA GPM ingest (SMAP Huaral pending)
on:
  workflow_dispatch:
  # Manual-only in the new repository: never consume the free R2 quota
  # through a scheduled background ingestion without explicit opt-in.
permissions:
  contents: read
concurrency:
  group: nasa-private-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check private archive readiness without printing secrets
        id: gate
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          TERRA_OBJECT_BUCKET: ${{ secrets.TERRA_OBJECT_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRA_OBJECT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRA_OBJECT_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$EARTHDATA_TOKEN" ] && [ -n "$TERRA_OBJECT_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "NASA ingestion configured; executing strict daily limits."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NASA ingestion is inactive: connect private Earthdata + S3/R2 credentials first."
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install bounded NASA ingest dependencies
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install -r backend/requirements.txt
      - name: Prune 14-day private retention and ingest 1 original GPM file
        if: steps.gate.outputs.ready == 'true'
        env:
          PYTHONPATH: backend
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          TERRA_OBJECT_BUCKET: ${{ secrets.TERRA_OBJECT_BUCKET }}
          TERRA_OBJECT_ENDPOINT: ${{ secrets.TERRA_OBJECT_ENDPOINT }}
          TERRA_OBJECT_REGION: ${{ secrets.TERRA_OBJECT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRA_OBJECT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRA_OBJECT_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python scripts/prune_nasa_archive.py
          python scripts/ingest_nasa_archive.py --product gpm --lag-days 7
          # Do not keep ingesting Calca/Cusco SMAP subsets for the Huaral pilot.
          # Preserve historical manifests; enable SMAP only after an official
          # Huando-area AOI and a versioned verified subset migration exist.
          echo "SMAP automated ingestion paused: Huando Huaral AOI not verified yet."
