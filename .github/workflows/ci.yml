name: TERRA360 quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Python unit tests (no real tokens)
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Compile production frontend
        working-directory: frontend
        run: npm run build

  docker-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Build the exact Render Docker context and verify native dependencies
        run: docker build -f backend/Dockerfile -t terra360-backend:ci backend
      - name: Exercise the API health and Sentinel-2 routes inside the container
        run: |
          docker run --rm terra360-backend:ci python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          assert client.get('/api/health').status_code == 200
          assert '/api/environment/sentinel-2/parcel-ndvi' in app.openapi()['paths']
          assert client.post('/api/environment/sentinel-2/parcel-ndvi', json={}).status_code == 422
          print('Render image starts and Sentinel-2 route is reachable')
          "
