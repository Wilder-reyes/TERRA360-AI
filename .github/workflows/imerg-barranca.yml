name: BIOTEX · NASA IMERG Barranca ingest (manual, bounded)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Search metadata only or calculate the Barranca IMERG monthly summary'
        type: choice
        options: [dry-run, ingest]
        default: dry-run
      start_year:
        description: 'Start year for historical monthly series (2015 covers 10+ years)'
        type: string
        default: '2015'
permissions:
  contents: read
jobs:
  barranca-imerg:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NASA ingest packages
        run: python -m pip install 'earthaccess==0.19.0' 'numpy>=1.26,<3' 'h5py>=3.10,<4' python-dotenv
      - name: Validate bounded input
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: |
          python - <<'PY'
          import os
          value=os.environ['START_YEAR']
          if not value.isdigit() or not (2011<=int(value)<=2025):
              raise SystemExit('Choose a year between 2011 and 2025')
          # Maximum 160 granules protects the workflow from bulk archive transfers.
          PY
      - name: Read NASA catalogue or calculate scientific summary
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          START_YEAR: ${{ inputs.start_year }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "dry-run" ]; then
            python scripts/precompute_imerg_basins.py --zone barranca --start "$START_YEAR" --max-granules 160 --dry-run
          else
            test -n "$EARTHDATA_TOKEN" || { echo 'Set EARTHDATA_TOKEN in GitHub repository secrets, never in source code'; exit 1; }
            python scripts/precompute_imerg_basins.py --zone barranca --start "$START_YEAR" --max-granules 160
          fi
      - name: Upload summary for scientific review only (never auto-commit)
        if: ${{ inputs.mode == 'ingest' }}
        uses: actions/upload-artifact@v4
        with:
          name: biotex-barranca-imerg-review
          path: backend/app/data/imerg_basin_seed.json
          retention-days: 7
          if-no-files-found: error
