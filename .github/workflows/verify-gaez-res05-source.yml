name: Verify official FAO GAEZ v5 RES05-SIX inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_gaez_res05_official.py'
      - 'tests/test_gaez_official_inventory.py'
      - '.github/workflows/verify-gaez-res05-source.yml'
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install inventory reader and bounded HTTP client
        run: python -m pip install 'pandas>=2.2,<4' 'openpyxl>=3.1,<4' 'requests>=2.31,<3'
      - name: Parse FAO RES05 LIST_FILES metadata and check one exact cloud object
        run: |
          python scripts/verify_gaez_res05_official.py
          echo 'Probe success means only the catalog was checked; no suitability score is published.'
